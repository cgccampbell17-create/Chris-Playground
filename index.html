<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Click Me</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 30% 20%, #eef3ff 0%, #dde6fb 45%, #cfd9f5 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .btn {
      position: relative;
      padding: 16px 42px;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #1d6ae5;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(29, 106, 229, 0.35);
      border-radius: 14px;
      cursor: pointer;
      overflow: hidden;
      transition: color 0.25s ease, box-shadow 0.25s ease, transform 0.15s ease, border-color 0.25s ease;
      box-shadow: 0 4px 16px rgba(29, 106, 229, 0.15);
    }

    /* soft glow that blooms on hover */
    .btn::after {
      content: "";
      position: absolute;
      inset: -40%;
      background: radial-gradient(circle, rgba(99, 153, 255, 0.55) 0%, rgba(99, 153, 255, 0) 65%);
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 0;
    }

    /* gradient fill sweep on hover */
    .btn::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #1d6ae5, #5b9dff);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 0;
    }

    .btn:hover::after { opacity: 1; }
    .btn:hover::before { transform: scaleX(1); }
    .btn:hover {
      color: #fff;
      border-color: transparent;
      box-shadow: 0 10px 30px rgba(29, 106, 229, 0.4);
      transform: translateY(-2px);
    }

    .btn:active {
      transform: translateY(0) scale(0.97);
      box-shadow: 0 4px 14px rgba(29, 106, 229, 0.3);
    }

    .btn span { position: relative; z-index: 1; }
  </style>
</head>
<body>
  <button class="btn">
    <span>Click me</span>
  </button>
</body>
</html>
