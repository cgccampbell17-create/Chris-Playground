<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Click Me</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f0f4ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .btn {
      position: relative;
      padding: 14px 36px;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #1d6ae5;
      background: #fff;
      border: 2px solid #1d6ae5;
      border-radius: 10px;
      cursor: pointer;
      overflow: hidden;
      transition: color 0.22s ease, box-shadow 0.22s ease, transform 0.14s ease;
      box-shadow: 0 2px 8px rgba(29, 106, 229, 0.12);
    }

    /* ripple fill on hover */
    .btn::before {
      content: "";
      position: absolute;
      inset: 0;
      background: #1d6ae5;
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 0;
    }

    .btn:hover::before { transform: scaleX(1); }
    .btn:hover {
      color: #fff;
      box-shadow: 0 6px 20px rgba(29, 106, 229, 0.35);
    }

    .btn:active { transform: scale(0.96); }

    .btn span { position: relative; z-index: 1; }
  </style>
</head>
<body>
  <button class="btn">
    <span>Click me</span>
  </button>
</body>
</html>
